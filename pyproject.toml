[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=61.2",
]

[project]
name = "weasyl-old-templates"
version = "1.0.0"

[tool.setuptools]
packages = [ "web" ]
platforms = [ "any" ]
include-package-data = false

[tool.ruff]
target-version = "py310"

line-length = 320
lint.select = [
  "C9",
  "E",
  "F",
  "I",
  "PLC",
  "PLE",
  "PLR",
  "UP",
  "W",
]
lint.ignore = [
  "UP031",
]
lint.mccabe.max-complexity = 20
lint.pylint.allow-magic-value-types = [ "int", "str" ]
