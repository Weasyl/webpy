[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=61.2",
]

[project]
name = "weasyl-old-templates"
version = "1.0.0"
dependencies = [
  "more_itertools>=2.6",
]

[tool.setuptools]
packages = [ "web" ]
platforms = [ "any" ]
include-package-data = false

[tool.ruff]
target-version = "py310"

line-length = 320
lint.select = [
  "C9",
  "E",
  "F",
  "I",
  "PLC",
  "PLE",
  "PLR",
  "UP",
  "W",
]
lint.ignore = [
  "E722",
  "E731",
  "F821",
  "PLC0415",
  "PLR5501",
  "UP031",
]
lint.mccabe.max-complexity = 20
lint.pylint.allow-magic-value-types = [ "int", "str" ]
lint.pylint.max-args = 9 # default is 5
lint.pylint.max-branches = 17 # default is 12
lint.pylint.max-returns = 8 # default is 6
